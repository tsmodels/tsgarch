on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r:   'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r:  'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r:  'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_TIMINGS_: "0"

    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - name: Install XQuartz (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask xquartz
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-build-vignettes", "--no-manual")'

      - name: Test timings by file
        if: success() || failure()
        shell: Rscript {0}
        run: |
          lib <- normalizePath("check/tsgarch.Rcheck", mustWork = FALSE)
          if (!dir.exists(file.path(lib, "tsgarch"))) quit(save = "no")
          .libPaths(c(lib, .libPaths()))
          suppressMessages({library(testthat); library(tsgarch)})
          r <- as.data.frame(test_dir("tests/testthat", package = "tsgarch", load_package = "installed",
                                      reporter = "silent", stop_on_failure = FALSE))
          options(width = 200)
          a <- aggregate(real ~ file, r, sum)
          print(a[order(-a$real), ], row.names = FALSE)
          cat("Total:", round(sum(r$real), 1), "s\n\nSlowest tests:\n")
          r <- r[order(-r$real), c("file", "test", "real")]
          print(head(r, 15), row.names = FALSE, right = FALSE)
